<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 250" width="240" height="250" role="img" aria-label="Pink lily flower">
  <defs>
    <linearGradient id="petalA" x1="0.5" y1="1" x2="0.5" y2="0">
      <stop offset="0%" stop-color="#f18bab"/>
      <stop offset="45%" stop-color="#ffc3d6"/>
      <stop offset="100%" stop-color="#fff3f7"/>
    </linearGradient>
    <linearGradient id="petalB" x1="0.5" y1="1" x2="0.5" y2="0">
      <stop offset="0%" stop-color="#e9769b"/>
      <stop offset="45%" stop-color="#ffb0c8"/>
      <stop offset="100%" stop-color="#fff0f5"/>
    </linearGradient>
    <linearGradient id="petalBack" x1="0.5" y1="1" x2="0.5" y2="0">
      <stop offset="0%" stop-color="#dd6d92"/>
      <stop offset="55%" stop-color="#f9a9c0"/>
      <stop offset="100%" stop-color="#ffe4ee"/>
    </linearGradient>
    <radialGradient id="throat" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe9a8"/>
      <stop offset="55%" stop-color="#fbd489" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#f4a259" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stemG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6f9f60"/>
      <stop offset="55%" stop-color="#8fbf7d"/>
      <stop offset="100%" stop-color="#6f9f60"/>
    </linearGradient>
    <linearGradient id="antherG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c0553b"/>
      <stop offset="100%" stop-color="#8e3421"/>
    </linearGradient>
  </defs>

  <!-- stem + leaves -->
  <path d="M119 104 C 115 150, 125 186, 119 244" stroke="url(#stemG)" stroke-width="7" fill="none" stroke-linecap="round"/>
  <path d="M117 178 C 97 166, 78 172, 66 192 C 88 201, 108 194, 117 178 Z" fill="#8fbf7d"/>
  <path d="M117 178 C 97 166, 78 172, 66 192" stroke="#6f9f60" stroke-width="1.6" fill="none" opacity="0.7"/>
  <path d="M121 205 C 138 198, 154 204, 162 219 C 145 226, 128 219, 121 205 Z" fill="#7fb26e"/>
  <path d="M121 205 C 138 198, 154 204, 162 219" stroke="#6f9f60" stroke-width="1.6" fill="none" opacity="0.7"/>

  <!-- back petals -->
  <g stroke="#d96a8c" stroke-width="1.4" stroke-linejoin="round">
    <path transform="rotate(60 120 102)" fill="url(#petalBack)"
      d="M120 102 C 104 86, 97 58, 106 33 C 110 21, 126 20, 131 33 C 141 58, 136 86, 120 102 Z"/>
    <path transform="rotate(180 120 102)" fill="url(#petalBack)"
      d="M120 102 C 104 86, 97 58, 106 33 C 110 21, 126 20, 131 33 C 141 58, 136 86, 120 102 Z"/>
    <path transform="rotate(300 120 102)" fill="url(#petalBack)"
      d="M120 102 C 104 86, 97 58, 106 33 C 110 21, 126 20, 131 33 C 141 58, 136 86, 120 102 Z"/>
  </g>

  <!-- front petals -->
  <g stroke="#d4587f" stroke-width="1.5" stroke-linejoin="round">
    <path fill="url(#petalA)" d="M120 102 C 104 86, 97 58, 106 33 C 110 21, 126 20, 131 33 C 141 58, 136 86, 120 102 Z"/>
    <path transform="rotate(120 120 102)" fill="url(#petalB)"
      d="M120 102 C 104 86, 97 58, 106 33 C 110 21, 126 20, 131 33 C 141 58, 136 86, 120 102 Z"/>
    <path transform="rotate(240 120 102)" fill="url(#petalA)"
      d="M120 102 C 104 86, 97 58, 106 33 C 110 21, 126 20, 131 33 C 141 58, 136 86, 120 102 Z"/>
  </g>

  <!-- petal midribs -->
  <g stroke="#e07898" stroke-width="1.2" fill="none" opacity="0.75" stroke-linecap="round">
    <path d="M120 96 C 118 76, 118 52, 121 34"/>
    <path transform="rotate(60 120 102)" d="M120 96 C 118 76, 118 52, 121 34"/>
    <path transform="rotate(120 120 102)" d="M120 96 C 118 76, 118 52, 121 34"/>
    <path transform="rotate(180 120 102)" d="M120 96 C 118 76, 118 52, 121 34"/>
    <path transform="rotate(240 120 102)" d="M120 96 C 118 76, 118 52, 121 34"/>
    <path transform="rotate(300 120 102)" d="M120 96 C 118 76, 118 52, 121 34"/>
  </g>

  <!-- throat glow -->
  <circle cx="120" cy="102" r="26" fill="url(#throat)"/>

  <!-- freckles -->
  <g fill="#c2415f" opacity="0.8">
    <circle cx="113" cy="84" r="1.9"/><circle cx="127" cy="83" r="1.7"/>
    <circle cx="106" cy="70" r="1.6"/><circle cx="134" cy="71" r="1.6"/>
    <circle cx="117" cy="64" r="1.5"/><circle cx="124" cy="65" r="1.4"/>
    <circle cx="103" cy="95" r="1.7"/><circle cx="138" cy="96" r="1.7"/>
    <circle cx="114" cy="116" r="1.6"/><circle cx="127" cy="117" r="1.6"/>
  </g>

  <!-- stamens: filaments + anthers -->
  <g fill="none" stroke="#f7b9cb" stroke-width="3" stroke-linecap="round">
    <path d="M120 102 C 96 92, 78 78, 66 62"/>
    <path d="M120 102 C 144 92, 162 78, 174 62"/>
    <path d="M120 102 C 100 112, 84 128, 76 146"/>
    <path d="M120 102 C 140 112, 156 128, 164 146"/>
    <path d="M120 102 C 118 78, 116 60, 112 44"/>
    <path d="M120 102 C 124 80, 130 64, 140 50"/>
  </g>
  <g fill="url(#antherG)">
    <rect x="54" y="53" width="15" height="7" rx="3.5" transform="rotate(-42 61 56)"/>
    <rect x="171" y="53" width="15" height="7" rx="3.5" transform="rotate(42 178 56)"/>
    <rect x="68" y="143" width="15" height="7" rx="3.5" transform="rotate(60 75 146)"/>
    <rect x="157" y="143" width="15" height="7" rx="3.5" transform="rotate(-60 164 146)"/>
    <rect x="104" y="37" width="15" height="7" rx="3.5" transform="rotate(-15 111 40)"/>
    <rect x="137" y="43" width="15" height="7" rx="3.5" transform="rotate(35 144 46)"/>
  </g>

  <!-- pistil with stigma -->
  <path d="M120 102 C 132 116, 140 132, 144 150" stroke="#efd7a2" stroke-width="3.4" fill="none" stroke-linecap="round"/>
  <circle cx="145" cy="152" r="5.2" fill="#e7c46a"/>
  <circle cx="145" cy="152" r="2.2" fill="#c9a13f"/>
</svg>
